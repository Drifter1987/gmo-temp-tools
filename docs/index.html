<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1211">
  <title>GMO TempTools</title>
  <link rel="stylesheet" href="./app.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://gmo-temptools-web-api-z1jsh3.freebuff.site; frame-src https://gmo-temptools-web-api-z1jsh3.freebuff.site; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="./config.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="dot"></span> GMO <span class="brand-dim">TempTools</span></a>
    <div class="topbar-actions">
      <button class="btn small primary install-app" id="install-app" type="button" title="Install GMO TempTools as an app" hidden>Install app</button>
      <span class="top-status" id="mode-status"><span class="pulse"></span> local only</span>
    </div>
  </header>
  <nav class="main-tabs" id="main-tabs" aria-label="Tools">
    <button class="main-tab" data-screen="mail">Mail</button>
    <button class="main-tab" data-screen="sms">SMS <span class="tab-beta">Beta</span></button>
    <button class="main-tab" data-screen="otp">OTP</button>
    <button class="main-tab" data-screen="settings">Settings</button>
  </nav>
  <main class="wrap" id="app">
    <p class="muted">Loading GMO TempTools…</p>
  </main>
  <footer class="foot">
    <span>GMO TempTools</span>
    <span class="sep">·</span>
    <span id="footer-mode">mail 8781 · texts 8782 · otp local</span>
  </footer>
  <script src="./ui.js"></script>
  <script src="./app.js"></script>
</body>
</html>
