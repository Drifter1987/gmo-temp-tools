<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMO TempTools · unlock</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1211; --panel:#141b19; --panel-2:#1a2320; --line:#293732; --line-soft:#1c2623; --text:#e8f1ed; --muted:#91a29b; --accent:#40d69b; --on-accent:#06120e; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace; --sans:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(900px 500px at 50% -10%, rgba(64,214,155,.08), transparent 62%), var(--bg); color:var(--text); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
    main { width:min(420px, calc(100% - 32px)); padding:28px; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 24px 70px rgba(0,0,0,.35); }
    .brand { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px rgba(64,214,155,.7); }
    .dim { color:var(--muted); font-weight:500; }
    h1 { margin:26px 0 6px; font-size:24px; letter-spacing:-.03em; }
    p { margin:0 0 18px; color:var(--muted); font-size:12.5px; }
    label { display:block; margin-bottom:6px; color:var(--muted); font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; }
    input { width:100%; height:38px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--text); font:13px var(--mono); outline:none; transition:border-color .14s ease, box-shadow .14s ease; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(64,214,155,.12); }
    button { width:100%; height:38px; margin-top:14px; padding:0 14px; border:1px solid var(--accent); border-radius:9px; background:var(--accent); color:var(--on-accent); font:700 13px/1.2 var(--sans); cursor:pointer; }
    button:hover { filter:brightness(1.06); }
    .hint { margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:11.5px; }
    code { color:var(--text); font:11.5px var(--mono); background:var(--panel-2); border:1px solid var(--line-soft); padding:1px 6px; border-radius:5px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="dot"></span> GMO <span class="dim">TempTools</span></div>
    <h1>Unlock the local app</h1>
    <p>This app stores verification codes and accepts carrier webhooks, so the browser must present the per-install token.</p>
    <form action="/auth" method="post" autocomplete="off">
      <label for="token">Install token</label>
      <input id="token" name="token" type="password" required autofocus spellcheck="false" autocomplete="off" placeholder="Paste the token from .run/auth-token">
      <button type="submit">Unlock</button>
    </form>
    <div class="hint">The token is stored locally at <code>.run/auth-token</code>. It is never sent to a third party.</div>
  </main>
</body>
</html>
