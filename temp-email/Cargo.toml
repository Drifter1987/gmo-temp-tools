[package]
name = "temp-email"
version = "0.2.0"
edition = "2021"

[dependencies]
temp-ui = { path = "../temp-ui" }
eframe = "0.32"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
local-auth = { path = "../local-auth" }
desktop-notifications = { path = "../desktop-notifications" }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }
