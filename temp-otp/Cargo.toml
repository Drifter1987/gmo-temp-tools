[package]
name = "temp-otp"
version = "0.2.0"
edition = "2021"

[lib]
name = "temp_otp"
path = "src/lib.rs"

[dependencies]
temp-ui = { path = "../temp-ui" }
eframe = "0.32"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
