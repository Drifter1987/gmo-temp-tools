[package]
name = "gmo-temptools"
version = "0.3.0"
edition = "2021"
description = "One desktop app for temporary email, SMS and OTP verification"

[[bin]]
name = "gmo-temptools"
path = "src/main.rs"

[workspace]
members = [
    "desktop-notifications",
    "local-auth",
    "temp-email",
    "temp-sms",
    "temp-otp",
    "temp-ui",
    "webhook-sign",
]
resolver = "2"

[dependencies]
eframe = "0.32"
tiny_http = "0.12"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
local-auth = { path = "local-auth" }
desktop-notifications = { path = "desktop-notifications" }
temp-email = { path = "temp-email" }
temp-sms = { path = "temp-sms" }
temp-otp = { path = "temp-otp" }
temp-ui = { path = "temp-ui" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.25"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
opt-level = "s"
